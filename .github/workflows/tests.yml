name: Light benchmark checks

on:
  push:
  pull_request:

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-host.txt
      - run: python -m pip install -r requirements-host.txt
      - run: python benchmark.py audit
      - run: python -m pytest tests/test_protocol.py tests/test_sources.py tests/test_publication.py tests/test_groups.py tests/test_light_integration.py -q
